<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Portfolio</title>

    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <!-- HEADER -->
    <header>
        <nav id="nav">

            <div class="nav-content">

                <div class="nav-brand">
                    Portfolio
                </div>

                <div class="language-selector">

                    <label id="languageLabel" for="languageSelect">
                        Language
                    </label>

                    <select id="languageSelect">
                        <option value="ca">CA</option>
                        <option value="en">EN</option>
                    </select>

                </div>

            </div>

        </nav>
    </header>


    <!-- MAIN -->
    <main>

        <div id="main">

            <!-- PROJECT LIST -->
            <div id="projectList">

                <table id="filterTable"></table>

                <ul id="projectLi"></ul>

            </div>


            <!-- PROJECT DETAIL -->
            <div id="projectShow">
                <article class="introduction">

            <p class="intro-eyebrow">
                PORTFOLIO
            </p>

            <h1>
                ${escapeHTML(t("introTitle"))}
            </h1>

            <p class="intro-description">
                ${escapeHTML(t("introText"))}
            </p>


            <!-- SAMPLE IMAGES -->

            <section class="intro-gallery">

                <h2>
                    ${escapeHTML(t("introGallery"))}
                </h2>

                <div class="intro-images">

                    <figure>
                        <img
                            src="https://picsum.photos/seed/portfolio-01/1200/900"
                            alt="Portfolio sample image 1"
                            loading="lazy"
                        >
                    </figure>

                    <figure>
                        <img
                            src="https://picsum.photos/seed/portfolio-02/1200/900"
                            alt="Portfolio sample image 2"
                            loading="lazy"
                        >
                    </figure>

                    <figure>
                        <img
                            src="https://picsum.photos/seed/portfolio-03/1200/900"
                            alt="Portfolio sample image 3"
                            loading="lazy"
                        >
                    </figure>

                </div>

            </section>


            <!-- YOUTUBE VIDEO -->

            <section class="intro-video">

                <h2>
                    ${escapeHTML(t("introVideo"))}
                </h2>

                <div class="youtube-container">

                    <iframe
                        src="https://www.youtube-nocookie.com/embed/M7lc1UVf-VE"
                        title="YouTube video player"
                        loading="lazy"
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                        referrerpolicy="strict-origin-when-cross-origin"
                        allowfullscreen
                    ></iframe>

                </div>

            </section>

        </article>
            </div>

        </div>

    </main>


    <!-- SCRIPTS -->
    <script src="./js/projects.js"></script>
    <script src="./js/main.js"></script>

</body>

</html>
